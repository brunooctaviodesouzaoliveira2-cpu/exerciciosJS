<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <style>
@media (max-width: 575.98px) {
    body {
        background-color: rgb(238, 245, 213);
    }
}

@media (min-width: 576px) and (max-width: 767.98px) {
    body {
        background-color: rgb(182, 217, 247);
    }
}

@media (min-width: 768px) and (max-width: 991.98px) {
    body {
        background-color: rgb(57, 157, 245);
    }
}

@media (min-width: 992px) and (max-width: 1199.98px) {
    body {
        background-color: rgb(0, 59, 111);
    }
}

@media (min-width: 1200px) {
    body {
        background-color: rgb(3, 55, 100);
    }
}
</style>
  </head>
  <body>
    <h1 class="text-danger text-center">Hello world!</h1>
    <h2 class="text-sucess text-center">oloco</h2>
    <p class="bg-dark text-white text-center">Ronaldo</p>
    <p class="bg-primary text-white">Cleiton</p>
    <p class="bg-dunger text-white">Cleiton</p>
    <p class="bg-info text-white">Cleiton</p>
    <p class="bg-transparent text-white">Cleiton</p>
    <p class="bg-secondary text-white">Cleiton</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
