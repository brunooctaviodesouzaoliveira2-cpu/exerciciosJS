<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#007BFF,#00C853);
    font-family:Arial, Helvetica, sans-serif;
}

.calculadora{
    background:#222;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

#display{
    width:100%;
    height:60px;
    font-size:28px;
    text-align:right;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    padding:10px;
    box-sizing:border-box;
}

.botoes{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:10px;
}

button{
    height:60px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#444;
    color:white;
    transition:.2s;
}

button:hover{
    background:#666;
}

.zero{
    grid-column:span 2;
}
</style>
<body>

    <div class="calculadora">
        <input type="text" id="display" disabled>

        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="apagar()">←</button>
            <button onclick="adicionar('/')">÷</button>
            <button onclick="adicionar('*')">×</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('-')">-</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('+')">+</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button rowspan="2" onclick="calcular()">=</button>

            <button class="zero" onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
